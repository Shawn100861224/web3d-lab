name: Deploy frontend to GitHub Pages

# 触发：推 main 分支且改动涉及前端/工作流，或在 Actions 页手动点。
# 前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # 仓库名即子路径：/web3d-lab/
      # 第三个参数是站点根地址 —— 每个场景深链据此写自己的分享卡片（og:image 必须绝对地址）。
      # 从仓库信息推导，别写死，换仓库/换账号时不会错。
      - name: Build (static mode)
        working-directory: frontend
        run: bash scripts/build-for-pages.sh "/${GITHUB_REPOSITORY#*/}/" "" "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      # Pages 站点已用 gh api 创建（build_type=workflow）：workflow 里的 GITHUB_TOKEN
      # 没有创建站点的权限（会报 Resource not accessible by integration），所以不在这里 enable。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
