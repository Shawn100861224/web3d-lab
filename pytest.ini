[pytest]
# 这个文件存在的唯一原因：让「仓库根目录」和「backend 目录」执行同一条
# `python -m pytest -q` 得到同样的结果。它只影响收集/导入，不碰任何产品代码。
#
# ---------------------------------------------------------------------------
# 1) 修 `ModuleNotFoundError: No module named 'app'`
# ---------------------------------------------------------------------------
# backend/tests/conftest.py 用的是绝对导入（from app.db import ...），要求 backend/
# 在 sys.path 上。CI 是在 backend/ 工作目录下跑的，而 `python -m pytest` 会把 CWD
# 塞进 sys.path —— 恰好就是 backend/，所以这个问题一直没暴露；从仓库根目录跑时
# sys.path 里没有 backend/，收集 backend/tests 就直接炸。
# 这里显式把 backend/ 加进 sys.path，两条路径都成立。
# （pythonpath 的相对路径按 rootdir 解析，rootdir 就是本文件所在目录 = 仓库根。）
pythonpath = backend

# ---------------------------------------------------------------------------
# 2) 默认收集范围 = 后端测试（对应 CI 里 `working-directory: backend` 那一步）
# ---------------------------------------------------------------------------
# 这样从根目录执行不需要额外参数，收集到的就是同一批 39 项。
testpaths = backend/tests

# ---------------------------------------------------------------------------
# 3) 为什么默认**不**收集 pipeline/tests —— 这是显式排除，不是静默忽略
# ---------------------------------------------------------------------------
# pipeline/tests/test_colmap_parser.py 会 exec pipeline/03_train_gsplat.py，而后者
# `import torch`。torch 是 gsplat 训练侧的重依赖，本仓库的测试环境
# （backend/.venv，依赖真相源见 cloud/cloud-functions/requirements.txt）不装它，
# 从根目录收集会直接 "No module named 'torch'" → collection error，并把整个
# pytest 会话中断（连后端 39 项也一起跑不成）。
#
# 另外，pipeline/tests 里严格来说没有 pytest 用例：两个文件都只有 main()，
# 设计上是 `python tests/test_colmap_parser.py` 手动执行的脚本，
# 收集进来也拿不到任何测试项。
#
# 所以这里用 testpaths 把默认收集范围收窄到 backend/tests。
# 想在装了 torch 的 gsplat 环境里跑它，显式传路径即可 —— testpaths 只在
# 没有给参数时生效，不受影响：
#     pytest pipeline/tests
